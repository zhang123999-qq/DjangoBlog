name: Publish Docker Image

on:
  release:
    types: [published]

jobs:
  docker-hub:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/djangoblog:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/djangoblog:${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64

      - name: Skip Docker Hub publish
        if: env.DOCKERHUB_ENABLED != 'true'
        run: echo "Docker Hub credentials are not configured; skipping Docker Hub publish."
