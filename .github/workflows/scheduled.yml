name: Scheduled Tasks

on:
  schedule:
    # 每周一凌晨 2 点运行安全扫描
    - cron: '0 2 * * 1'
    # 每天凌晨 3 点检查依赖更新（已由 Dependabot 原生处理，保留 cron 仅作参考）
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  security-scan:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies and security tools
        run: |
          uv venv
          uv pip install -r requirements/production.txt
          uv pip install safety pip-audit bandit

      - name: Run Safety check
        run: |
          uv run safety check --full-report --output json > safety-report.json 2>&1 || \
            echo "SAFETY_EXIT=$?" >> "$GITHUB_ENV"

      - name: Run pip-audit
        run: |
          uv run pip-audit --format json > pip-audit-report.json 2>&1 || \
            echo "PIPAUDIT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Run Bandit
        run: |
          uv run bandit -r apps/ -f json -o bandit-report.json 2>&1 || \
            echo "BANDIT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Create security issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const safetyReport = fs.existsSync('safety-report.json') ? fs.readFileSync('safety-report.json', 'utf8') : '{}';
            const banditReport = fs.existsSync('bandit-report.json') ? fs.readFileSync('bandit-report.json', 'utf8') : '{}';

            const dateStr = new Date().toISOString().split('T')[0];
            const title = `🔒 Weekly Security Scan Report - ${dateStr}`;

            const body = `
            ## Security Scan Results

            ### Safety Check
            \`\`\`json
            ${safetyReport}
            \`\`\`

            ### Bandit Check
            \`\`\`json
            ${banditReport}
            \`\`\`

            ---
            *This is an automated security scan report generated on ${dateStr}.*
            `;

            // 1. 查找同标题的开启 issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
              per_page: 100
            });

            const existingIssue = existingIssues.data.find(issue => issue.title === title);

            if (existingIssue) {
              // 2. 存在同标题 issue -> 更新 body
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated existing security scan issue #${existingIssue.number}`);
            } else {
              // 3. 不存在 -> 创建新 issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated']
              });
              console.log('Created new security scan issue');
            }

            // 4. 可选：关闭 30 天前的旧 security scan issue
            const oldIssues = existingIssues.data.filter(issue => {
              const created = new Date(issue.created_at);
              const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
              return created < thirtyDaysAgo && issue.title.startsWith('🔒 Weekly Security Scan Report');
            });

            for (const oldIssue of oldIssues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: oldIssue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed old security scan issue #${oldIssue.number}`);
            }

  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '30 days'
          skip-recent: 5

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10