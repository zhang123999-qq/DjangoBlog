# ========================================
# DjangoBlog Docker Compose (5 容器版)
# ========================================
# 容器: db, redis, web, celery_worker, celery_beat
# 说明: 宿主机 Nginx 反向代理到 web:8000
#       migrate/collectstatic 在 web 启动时由 entrypoint.sh 自动执行
# ========================================

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  beat_schedule:

networks:
  djangoblog:
    driver: bridge

# 通用 Django 环境变量（YAML anchor，避免重复）
x-django-env: &django-env
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
  DB_ENGINE: ${DB_ENGINE:-django.db.backends.mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-djangoblog}
  DB_USER: ${DB_USER:-djangouser}
  DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/1}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD}@redis:6379/2}
  DJANGO_SETTINGS_MODULE: config.settings.production

x-django-logging: &django-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========================================
  # MySQL 8.0 数据库
  # ========================================
  db:
    image: mysql:8.0
    container_name: djangoblog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-djangoblog}
      MYSQL_USER: ${DB_USER:-djangouser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    # 仅内部网络访问，不对外暴露
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - djangoblog
    logging: *django-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
      --max-connections=200
      --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ========================================
  # Redis 7 缓存/消息队列
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: djangoblog-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - djangoblog
    logging: *django-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  # ========================================
  # Django Web 应用 (Gunicorn)
  # ========================================
  # entrypoint.sh 自动执行 migrate + collectstatic + compress
  # 然后启动 Gunicorn，宿主机 Nginx 反向代理到此端口
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: djangoblog-web:latest
    container_name: djangoblog-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      BAIDU_APP_ID: ${BAIDU_APP_ID:-}
      BAIDU_API_KEY: ${BAIDU_API_KEY:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    # 仅绑定到宿主机 127.0.0.1，由宿主机 Nginx 反向代理
    # 避免直接暴露到公网，绕过 Nginx 安全防护
    ports:
      - "127.0.0.1:${WEB_PORT_EXPOSED:-8000}:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - djangoblog
    logging: *django-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["gunicorn", "config.wsgi:application", "--config", "deploy/gunicorn.conf.py"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

  # ========================================
  # Celery Worker (异步任务处理)
  # ========================================
  celery_worker:
    image: djangoblog-web:latest
    container_name: djangoblog-celery-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      BAIDU_APP_ID: ${BAIDU_APP_ID:-}
      BAIDU_API_KEY: ${BAIDU_API_KEY:-}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY:-}
    volumes:
      - logs_volume:/app/logs
      - media_volume:/app/media
    networks:
      - djangoblog
    logging: *django-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "celery -A config inspect ping --timeout=5 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4", "--pool=prefork", "--max-tasks-per-child=1000", "--queues=celery,low_priority"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ========================================
  # Celery Beat (定时任务调度器)
  # ========================================
  celery_beat:
    image: djangoblog-web:latest
    container_name: djangoblog-celery-beat
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
    volumes:
      - logs_volume:/app/logs
      - beat_schedule:/app/beat_schedule
    networks:
      - djangoblog
    logging: *django-logging
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 $(cat /app/beat_schedule/celerybeat.pid 2>/dev/null) 2>/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--pidfile=/app/beat_schedule/celerybeat.pid", "--schedule=/app/beat_schedule/celerybeat-schedule"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
