# DjangoBlog Nginx 配置（前端分离架构）
# 前端：Astro 静态站点 → /www/wwwroot/DjangoBlog/frontend/dist/
# 后端：Django API + Admin → http://127.0.0.1:8000
#
# 使用方法：
#   1. 将此文件复制到 Nginx 配置目录（如 /www/server/panel/vhost/nginx/DjangoBlog.conf）
#   2. 修改 server_name 为你的域名
#   3. 修改 SSL 证书路径
#   4. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;  # ← 改为你的域名
    server_tokens off;

    # --- SSL 配置 ---
    ssl_certificate     /www/server/panel/vhost/cert/DjangoBlog/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/DjangoBlog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- 安全头（与 Django CSPMiddleware 双重防护）---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # HTTP → HTTPS 跳转
    set $redirect 1;
    if ($server_port != 443) { set $redirect 2; }
    if ($uri ~ /\.well-known/) { set $redirect 1; }
    if ($redirect != 1) { rewrite ^(/.*)$ https://$host$1 permanent; }

    # --- Gzip 压缩 ---
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # ================================================================
    # 1. Django Admin + API → 反向代理到 Gunicorn
    # ================================================================
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # SSE/WebSocket 支持（通知接口）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # WebSocket 通知端点
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 认证相关路由（login/register 等仍走 Django）
    location /accounts/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location = /healthz/ {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # 内容审核
    location /moderation/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ================================================================
    # 2. Django 静态资源（/static/ /media/）
    # ================================================================
    location /static/ {
        alias /www/wwwroot/DjangoBlog/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    location /media/ {
        alias /www/wwwroot/DjangoBlog/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # ================================================================
    # 3. 前端 Astro 静态站点（根路由 + SPA fallback）
    # ================================================================
    root /www/wwwroot/DjangoBlog/frontend/dist;

    # Astro 构建产物（带 hash 的 JS/CSS）→ 长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Favicon / 静态资源
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # 前端路由 fallback：所有未匹配的路径 → index.html（SPA 路由）
    # 排除已有 proxy_pass 的路径（/api/ /admin/ /accounts/ 等已优先匹配）
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # ================================================================
    # 安全：禁止访问敏感文件
    # ================================================================
    location ~* (\.user\.ini|\.htaccess|\.env.*|\.git|\.project|requirements\.txt|pyproject\.toml|package\.json|tsconfig\.json)$ {
        return 404;
    }

    # ================================================================
    # 日志
    # ================================================================
    access_log /www/wwwlogs/DjangoBlog.log;
    error_log  /www/wwwlogs/DjangoBlog.error.log;
}
