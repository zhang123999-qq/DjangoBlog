# DjangoBlog 通用 Nginx 配置
# 适用于：宿主机 Nginx 反向代理到 Docker 容器
# 不适用于：宝塔面板（请使用 nginx.conf）
#
# 使用方法：
# 1. 复制到 /etc/nginx/sites-available/djangoblog
# 2. ln -s /etc/nginx/sites-available/djangoblog /etc/nginx/sites-enabled/
# 3. nginx -t && nginx -s reload
#
# 配置项：
# - server_name: 改为你的域名
# - upstream: Docker 容器映射端口（默认 127.0.0.1:8000）
# - 静态文件路径: Docker volume 在宿主机的挂载路径
# - SSL 证书路径（如需 HTTPS）

# 隐藏 Nginx 版本号
server_tokens off;

# Gzip 压缩
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    font/opentype
    font/ttf
    image/svg+xml;

upstream djangoblog_backend {
    # 宿主机 Nginx → Docker web 容器（端口映射在 docker-compose.yml 中定义）
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP 服务（可选：重定向到 HTTPS）
server {
    listen 80;
    server_name _;  # 匹配所有域名，生产环境请改为实际域名

    # 如需强制 HTTPS，取消注释以下行
    # return 301 https://$server_name$request_uri;

    # 上传文件大小限制
    client_max_body_size 10m;

    # 静态资源（Nginx 直接服务，不走 Django）
    # Docker volume 默认挂载路径，可通过 docker volume inspect 确认实际路径
    # 如需 Nginx 直接服务静态文件，取消注释并修改路径：
    # location /static/ {
    #     alias /var/lib/docker/volumes/deploy_static_volume/_data/;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    #     access_log off;
    # }
    #
    # location /media/ {
    #     alias /var/lib/docker/volumes/deploy_media_volume/_data/;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    #     access_log off;
    # }

    # WhiteNoise 已在 Django 层处理静态文件，默认由后端服务
    # 如需 Nginx 直接服务静态文件（性能更优），请取消上方注释并注释掉下方 proxy_pass

    # 反向代理到 Django
    location / {
        proxy_pass http://djangoblog_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲配置（适配 1.3MB 大页面）
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }

    # 健康检查端点（与 Django urls.py 的 healthz 一致）
    location /healthz/ {
        proxy_pass http://djangoblog_backend;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # 禁止访问敏感文件
    location ~* (\.env|\.git|\.project|requirements\.txt|pyproject\.toml)$ {
        return 404;
    }
}

